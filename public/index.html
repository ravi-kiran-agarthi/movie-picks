<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Picks</title>
<meta name="description" content="English movies in theatres and coming soon, ranked by IMDb and Rotten Tomatoes.">
<meta name="color-scheme" content="light dark">
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t})();
</script>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="data.json" as="fetch" crossorigin>
</head>
<body>
<div class="top"><div class="w"><header>
  <h1>Movie Picks</h1>
  <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
</header>
<nav class="bar">
  <div class="seg" id="status" role="tablist">
    <button data-s="now" class="on">Now playing</button>
    <button data-s="soon">Upcoming</button>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button data-g="All" class="on">All</button>
    <button data-g="Comedy">Comedy</button>
    <button data-g="Drama">Drama</button>
    <button data-g="Action">Action</button>
    <select id="more" aria-label="More genres"><option value="">More… (reset)</option></select>
  </div>
</nav></div></div>
<div class="w"><p id="meta" class="meta"></p>
<main id="list"></main></div>
<script src="app.js" defer></script>
</body>
</html>
